apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "movies.fullname" . }}-data-init
  labels:
    {{- include "movies.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "movies.name" . }}-data-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: data-init
          image: {{ .Values.image }}
          command: ["yarn", "load"]
          env:
            - name: MONGODB_PASSWORD
              value: mongodb123
            - name: MONGODB_USERNAME
              value: okteto
            - name: MONGODB_DATABASE
              value: okteto
            - name: MONGODB_HOST
              value: mongodb-rentals