apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "movies.fullname" . }}-mongodb-init
  labels:
    {{- include "movies.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "movies.name" . }}-mongodb-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongo-init
        image: mongo:8.0
        command:
        - bash
        - -c
        - |
          mongosh mongodb://mongodb-rentals-svc:27017 --eval "
            db.getSiblingDB('admin').auth('root', 'mongodb123root');
            try {
              db.getSiblingDB('okteto').createUser({
                user: 'okteto',
                pwd: 'mongodb123',
                roles: [{ role: 'readWrite', db: 'okteto' }]
              });
              print('User created successfully');
            } catch (e) {
              if (e.code === 51003) {
                print('User already exists');
              } else {
                throw e;
              }
            }
          "
      initContainers:
      - name: wait-for-mongodb
        image: mongo:8.0
        command:
        - bash
        - -c
        - |
          until mongosh mongodb://mongodb-rentals-svc:27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB to be ready..."
            sleep 5
          done