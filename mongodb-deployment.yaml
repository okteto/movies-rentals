apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
data:
  username: b2t0ZXRv # okteto
  password: bW9uZ29kYjEyMw== # mongodb123
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-rentals
  labels:
    app: mongodb-rentals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-rentals
  template:
    metadata:
      labels:
        app: mongodb-rentals
    spec:
      containers:
      - name: mongodb
        image: mongo:8.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "mongodb123root"
        - name: MONGO_INITDB_DATABASE
          value: "okteto"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-rentals-svc
  labels:
    app: mongodb-rentals
spec:
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  selector:
    app: mongodb-rentals

---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-user
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongo-init
        image: mongo:8.0
        command:
        - bash
        - -c
        - |
          mongosh mongodb://mongodb-rentals-svc:27017 --eval "
            db.getSiblingDB('admin').auth('root', 'mongodb123root');
            db.getSiblingDB('okteto').createUser({
              user: 'okteto',
              pwd: 'mongodb123',
              roles: [{ role: 'readWrite', db: 'okteto' }]
            });
          "
      initContainers:
      - name: wait-for-mongodb
        image: mongo:8.0
        command:
        - bash
        - -c
        - |
          until mongosh mongodb://mongodb-rentals-svc:27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB to be ready..."
            sleep 5
          done