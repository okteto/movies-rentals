icon: https://apps.okteto.com/movies/icon.png

build:
  rentals:
    context: .

deploy:
  commands:
    - helm repo add mongodb https://mongodb.github.io/helm-charts || true
    - helm repo update
    - helm upgrade --install rentals chart --set image=${OKTETO_BUILD_RENTALS_IMAGE}
  divert:
    namespace: staging

dev:
  rentals:
    command: yarn start
    sync:
      - .:/src
    forward:
      - 9229:9229
