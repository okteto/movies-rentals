icon: https://apps.okteto.com/movies/icon.png

build:
  rentals:
    context: .

deploy:
  commands:
    - helm repo add bitnami https://charts.bitnami.com/bitnami || true
    - helm repo update
    - helm upgrade --install mongodb-rentals bitnami/mongodb -f mongodb-values.yaml
    - helm upgrade --install rentals chart --set image=${OKTETO_BUILD_RENTALS_IMAGE}
  divert:
    namespace: staging

dev:
  rentals:
    command: yarn start
    sync:
      - .:/src
    forward:
      - 9229:9229
