## MongoDB Configuration for movies-rentals
##
## Global parameters
global:
  defaultStorageClass: ""

## MongoDB parameters
auth:
  enabled: true
  rootUser: root
  rootPassword: mongodb123root
  databases:
    - okteto
  usernames:
    - okteto
  passwords:
    - mongodb123

## MongoDB Pod parameters
image:
  tag: "8.0"

## MongoDB Service parameters
service:
  type: ClusterIP
  ports:
    mongodb: 27017

## Persistence parameters
persistence:
  enabled: true
  size: 8Gi
  accessModes:
    - ReadWriteOnce

## Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi" 
    cpu: "500m"

## Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1